context:
  name: ${{ load_from_file("pyproject.toml").project.name }}
  version: ${{ load_from_file("pyproject.toml").project.version }}
  python_min: "3.12"
  build: 0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  # Prioritize builds with a higher microarch level
  number: ${{ build|int + (microarch_level|int) * 100 }}
  script:
    - if: linux and x86_64
      then: |
        CXXFLAGS=${CXXFLAGS//-O2/}
        CXXFLAGS=${CXXFLAGS//-ftree-vectorize/}
        CXXFLAGS=$(printf '%s\n' "$CXXFLAGS" | sed -E 's/(^|[[:space:]])-march=[^[:space:]]*//g')
        CXXFLAGS=$(printf '%s\n' "$CXXFLAGS" | sed -E 's/(^|[[:space:]])-mtune=[^[:space:]]*//g')
        CXXFLAGS="${CXXFLAGS} -mtune=generic"
        export CXXFLAGS
        CPPFLAGS=${CPPFLAGS//-O2/}
        CPPFLAGS="${CPPFLAGS} -O3"
        export CPPFLAGS
        python -m pip install --no-build-isolation --no-deps -Ccmake.define.APITOFSIM_USE_VCPKG=OFF -Ccmake.define.APITOFSIM_NATIVE_PARQUET=ON -Ccmake.define.CMAKE_PREFIX_PATH="$PREFIX" .
    - if: osx or (linux and aarch64)
      then: |
        python -m pip install --no-build-isolation --no-deps -Ccmake.define.APITOFSIM_USE_VCPKG=OFF -Ccmake.define.APITOFSIM_NATIVE_PARQUET=ON -Ccmake.define.CMAKE_PREFIX_PATH="$PREFIX" .
    - if: win
      then: |
        set "LDFLAGS=%LDFLAGS:/link=%"
        set "CXXFLAGS=%CXXFLAGS% /Ot -march=x86-64-v2 -mtune=generic"
        python -m pip install --no-build-isolation --no-deps -Ccmake.define.APITOFSIM_USE_VCPKG=OFF -Ccmake.define.APITOFSIM_NATIVE_PARQUET=ON -Ccmake.define.CMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" .
  python:
    version_independent: true
    entry_points:
      - apitofsim = apitofsim.cli:cli

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.28
    - ninja
    - if: microarch_level|int > 0
      then: x86_64-microarch-level ==${{ microarch_level }}
    - if: linux and x86_64
      then:
        - libstdcxx-devel_linux-64 15.2.0.*
  host:
    - python ${{ python_min }}.*
    - python-abi3 ${{ python_min }}.*
    - pip
    - python-build
    - scikit-build-core >=0.11
    - nanobind 2.9.2
    - eigen
    - tbb-devel >=2023.0
    - libarrow 26.*
    - libparquet 26.*
    - if: linux and x86_64
      then:
        - libstdcxx-devel_linux-64 15.2.0.*
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - pint >= 0.25.1
    - duckdb >=1.4.2,<2
    - matplotlib >= 3.10.7
    - python-graphviz >= 0.21
    - holoviews >= 1.21.0
    - orjson >= 3.11.4
    - progress-table >= 3.2.2
    - ase >= 3.27.0
    - pyarrow 26.*
    - portalocker >= 3.2.0
    - if: win
      then: pywin32
    - click >= 8.2.0
    - questionary >= 2.1.1
    - tomlkit >= 0.14.0
    - tomlkit-extras >= 0.2.0
    - textalloc >= 1.2.3
    - tbb >=2023.0

tests:
  - python:
      imports:
        - ${{ name }}
        - ${{ name }}.${{ name }}raw
      python_version: ["${{ python_min ~ '.*' }}"]

  - script:
      - if: unix
        then: DATA_DIR=$(pwd)/test/data pytest ./test
      - if: win
        then: set "DATA_DIR=%CD%/test/data" && pytest ./test
      - python -c "from apitofsim import apitofsimraw; assert apitofsimraw.NATIVE_PARQUET"
      - python test/wheel_smoke.py
    requirements:
      run:
        - pytest
    files:
      source:
        - test/

about:
  homepage: https://github.com/VilmaLab/apitofsim
  license: MIT
  license_file:
    - LICENSE
  summary: Simulation of an APi-TOF Mass Spectrometer
  repository: https://github.com/VilmaLab/apitofsim
