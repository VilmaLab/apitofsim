name: Set up vcpkg
description: Bootstrap the registry commit recorded in vcpkg.json
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}-${{ github.job }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}-
          vcpkg-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      env:
        VCPKG_ROOT: ${{ runner.temp }}/apitofsim-vcpkg
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
      run: |
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        bash ci/setup_vcpkg.sh "$VCPKG_ROOT"
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_DEFAULT_BINARY_CACHE" >> "$GITHUB_ENV"
