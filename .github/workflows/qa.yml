name: QA (linters, typecheckers & formatters)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  typecheck_python:
    name: Typecheck Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - uses: ./.github/actions/setup-vcpkg

      - name: Install the package with plotting and notebook extras
        run: uv sync --no-editable --extra plot --extra notebooks

      - name: Run basedpyright
        run: |
          .venv/bin/basedpyright --pythonpath .venv/bin/python --level=error $(.venv/bin/python -c 'import apitofsim; import os; print(os.path.dirname(apitofsim.__file__))')

      - name: Run basedpyright with warnings
        run: |
          .venv/bin/basedpyright --pythonpath .venv/bin/python $(.venv/bin/python -c 'import apitofsim; import os; print(os.path.dirname(apitofsim.__file__))')

      - name: Run basedpyright coverage
        run: |
          # For some reason modifying the PATH like this is the only thing that seems to work
          PATH="$(pwd)/.venv/bin:$PATH" basedpyright --verifytypes apitofsim || true # Ignore failures for now

  lint_python:
    name: Style check Python
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v5

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "./python"

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "./python"

  lint_cpp:
    name: Build with Clang + C++ style check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: ./.github/actions/setup-vcpkg

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-20 clang-format-20 clang-20
          pip install 'nanobind==2.9.2'

      - name: Build with Clang and run native QA
        run: |
          CC=clang-20 CXX=clang++-20 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DAPITOFSIM_STRICT_WARNINGS=ON \
            -DAPITOFSIM_BUILD_PYTHON=ON -DCLANG_FORMAT=clang-format-20 -DCLANG_TIDY=clang-tidy-20
          cmake --build build
          cmake --build build --target clang-format-check
          cmake --build build --target clang-tidy
