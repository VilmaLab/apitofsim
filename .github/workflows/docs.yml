name: docs

# The docs import the built extension module, so they deploy only after the Linux
# wheel build succeeds, using that wheel instead of building from source here.
on:
  workflow_run:
    workflows: [Build Python wheels]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@v7

      - name: Download the Linux wheel
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: cibw-wheels-ubuntu-latest-*
          merge-multiple: true
          path: wheelhouse

      - name: Install docs dependencies and the wheel
        run: |
          uv sync --group docs --no-install-project --python 3.13
          uv pip install --no-deps wheelhouse/*.whl

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - run: uv run --no-sync mkdocs gh-deploy --force
