name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build_test_gcc:
    name: Native build and tests with GCC
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vcpkg
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPITOFSIM_STRICT_WARNINGS=ON
          cmake --build build
          ./test.sh --test-dir build

  build_test_llvm:
    name: Native and Python tests with Clang sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-vcpkg
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20
          uv sync --no-install-project
      - name: Build
        run: |
          uv run --no-sync cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAPITOFSIM_STRICT_WARNINGS=ON \
            -DAPITOFSIM_BUILD_PYTHON=ON -DAPITOFSIM_GENERATE_STUBS=OFF \
            -DPython_EXECUTABLE="$PWD/.venv/bin/python" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,float-divide-by-zero -shared-libasan -fno-omit-frame-pointer"
          uv run --no-sync cmake --build build
      - name: Run native and Python tests
        run: |
          export LD_LIBRARY_PATH="$(clang-20 -print-runtime-dir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./test.sh --test-dir build -E apitofsim-python-tests
          ASAN_OPTIONS=detect_leaks=0 LD_PRELOAD="$(clang-20 -print-file-name=libclang_rt.asan-x86_64.so)" \
            ./test.sh --test-dir build -R apitofsim-python-tests --no-tests=error

  build_test_x_dev:
    name: Python tests with -X dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-vcpkg
      - name: Install and test
        run: |
          uv sync
          DATA_DIR="$PWD/test/data" uv run --no-sync python -X dev -m pytest test/

  build_test_parquet:
    name: Build and test the Apache Parquet recorder with vcpkg
    runs-on: ubuntu-latest
    env:
      SKBUILD_CMAKE_DEFINE: APITOFSIM_NATIVE_PARQUET=ON
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-vcpkg
      - name: Build and exercise the native writer
        run: |
          uv sync --no-install-project
          uv pip install 'pyarrow==26.0.1'
          uv pip install --no-build-isolation --no-deps .
          uv run --no-sync python -c 'from apitofsim import apitofsimraw; assert apitofsimraw.NATIVE_PARQUET'
          DATA_DIR="$PWD/test/data" uv run --no-sync python -X dev -m pytest test/test_parquet_recording.py

  test_valgrind:
    name: Native tests under Valgrind
    runs-on: ubuntu-26.04
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-vcpkg
      - name: Install Clang and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 valgrind
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAPITOFSIM_STRICT_WARNINGS=ON
          cmake --build build
          ./test.sh --test-dir build -T memcheck --overwrite MemoryCheckCommand=/usr/bin/valgrind
