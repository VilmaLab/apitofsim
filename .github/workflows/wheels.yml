name: Build Python wheels

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build_linux_wheel:
    name: Build wheels on Linux
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ubuntu-latest

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}

  methods_pdf:
    name: Build simulation methods PDF
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache methods PDF
        id: methods-pdf
        uses: actions/cache@v4
        with:
          path: docs/simulation-methods.pdf
          key: methods-pdf-ubuntu-26.04-${{ hashFiles('docs/simulation-methods.tex', 'ci/build-methods.sh', '.github/workflows/wheels.yml') }}

      - name: Install LaTeX
        if: steps.methods-pdf.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-pictures

      - name: Build methods PDF
        if: steps.methods-pdf.outputs.cache-hit != 'true'
        run: bash ci/build-methods.sh "$RUNNER_TEMP/simulation-methods"

      - name: Upload methods PDF
        uses: actions/upload-artifact@v4
        with:
          name: simulation-methods-pdf
          path: docs/simulation-methods.pdf
          if-no-files-found: error

  docs:
    name: Docs
    needs: [build_linux_wheel, methods_pdf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Download methods PDF
        uses: actions/download-artifact@v4
        with:
          name: simulation-methods-pdf
          path: docs

      - name: Download the Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest
          path: wheelhouse

      - name: Install docs dependencies and the wheel
        run: |
          uv sync --group docs --no-install-project --python 3.13
          uv pip install --no-deps wheelhouse/*.whl

      - name: Build docs
        run: uv run --no-sync zensical build --clean

      - name: Deploy docs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          uv run --no-sync ghp-import --no-jekyll --push --force site
