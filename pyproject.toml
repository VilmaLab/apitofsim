[project]
name = 'apitofsim'
version = '0.29.0'
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ase>=3.27.0",
  "click>=8.2.0",
  "duckdb >= 1.4.2, <2",
  "numpy",
  "orjson>=3.11.4",
  "pandas",
  "pint>=0.25.1",
  "progress-table>=3.2.2",
  "pyarrow>=26.0.1",
  "portalocker>=3.2.0",
  "pywin32; sys_platform == 'win32'",
  "questionary>=2.1.1",
  "tomlkit>=0.14.0",
  "tomlkit-extras>=0.2.0",
]

[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.11", "nanobind==2.9.2"]

[project.optional-dependencies]
reflink = ["reflink>=0.2.2"]
plot = [
    "matplotlib>=3.10.7",
    "graphviz>=0.21",
    "holoviews>=1.21.0",
    "textalloc>=1.2.3",
    "seaborn>=0.13.2",
]
notebooks = ["marimo"]

[project.scripts]
apitofsim = "apitofsim.cli:cli"

[dependency-groups]
dev = [
  "scikit-build-core>=0.11",
  "nanobind==2.9.2",
  "cmake>=3.28",
  "ninja",
  "pip>=25.2",
  "basedpyright",
  "ruff>=0.15.2",
  "pytest>=9.0.2",
]
docs = [
  "ghp-import>=2.1.0",
  "mkdocs-click>=0.9.0",
  "mkdocstrings-python>=2.0.1",
  "zensical>=0.0.73,<0.1",
]
notebooks = ["scipy>=1.16.3", "sympy>=1.14.0", "marimo[sql]", "polars[pyarrow]"]

[tool.ruff]
extend-exclude = ["*.mo.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
cmake.define.BUILD_TESTING = "OFF"
cmake.define.APITOFSIM_BUILD_PYTHON = "ON"
wheel.packages = ["python/apitofsim"]
wheel.py-api = "cp312"
sdist.exclude = ["builds", ".cache"]

[tool.cibuildwheel]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64:latest"
build = "cp313-*"
skip = "*-manylinux_i686 cp3??t-* *-musllinux_*"
archs = ["auto64"]
# Keep the vcpkg libraries available to the repair tools after the build.
config-settings.build-dir = "builds/wheel"
test-requires = ["pytest"]
test-command = [
  "python {project}/test/wheel_smoke.py",
  "python {project}/test/parquet_wheel_smoke.py",
]

[tool.cibuildwheel.linux]
before-all = "bash ci/setup_linux.sh"
environment = { VCPKG_ROOT = "/opt/apitofsim-vcpkg", CC = "clang", CXX = "clang++", SKBUILD_CMAKE_DEFINE = "APITOFSIM_NATIVE_PARQUET=ON;VCPKG_TARGET_TRIPLET=x64-linux-wheel" }
repair-wheel-command = [
  "auditwheel repair --disable-isa-ext-check -w {dest_dir} {wheel}",
  "auditwheel show {dest_dir}/*.whl",
  "pipx run abi3audit --strict --report {wheel} --assume-minimum-abi3 3.12",
]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0", SKBUILD_CMAKE_DEFINE = "APITOFSIM_NATIVE_PARQUET=ON;VCPKG_TARGET_TRIPLET=arm64-osx-wheel" }

[tool.cibuildwheel.windows]
environment = { CMAKE_ARGS = "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl", SKBUILD_CMAKE_DEFINE = "APITOFSIM_NATIVE_PARQUET=ON;VCPKG_TARGET_TRIPLET=x64-windows-wheel" }
# CMake already installs oneTBB next to the extension and native executables.
repair-wheel-command = 'delvewheel repair --ignore-existing --add-path "{package}/builds/wheel/vcpkg_installed/x64-windows-wheel/bin" -w {dest_dir} {wheel}'

[[tool.cibuildwheel.overrides]]
select = "*-x86_64"
inherit.environment = "append"
environment.CXXFLAGS = "-march=x86-64-v3"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment._PYTHON_HOST_PLATFORM = "macosx-12.0-arm64"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
config-settings.build-dir = "builds/wheel-x86_64"
environment.SKBUILD_CMAKE_DEFINE = "APITOFSIM_NATIVE_PARQUET=ON;VCPKG_TARGET_TRIPLET=x64-osx-wheel"

[tool.pyright]
reportConstantRedefinition = false
reportImportCycles = false
failOnWarnings = false

[tool.uv]
no-build-isolation-package = ["apitofsim"]
